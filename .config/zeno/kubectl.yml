completions:
  # 最初に一致した補完が使われるので、より具体的なものから並べる
  # sourceCommand は現在のシェルで動くので KUBECONFIG (kubeswitch) の切り替えに追従する
  # 汎用の kubectl completer (最後) で補完できるものは個別に書かない。ここには複数選択など completer にできないものだけ置く
  # kubectl get pods -o<Tab> (スペースなし) → 出力形式を選んで -oyaml の形で入れる
  # completer だと "-o" という語の補完 (フラグ名) になるので、値を補完させるために空の語を足して渡す
  - name: kubectl output format (no space)
    patterns:
      - '^\s*kubectl\s(?:.*\s)?-o$'
    sourceCommand: 'a=(${(z)LBUFFER}); kubectl __complete "${(@)a[2,-1]}" "" 2>/dev/null | grep -v "^:"'
    options:
      --prompt: "'Output> '"
  # kubectl -n foo rollout restart <Tab> → 行内の namespace の Deployment / StatefulSet / DaemonSet を複数選ぶ
  # deploy/api deploy/worker のように種類/名前の形で入る。続けて Tab を押せば追加できる
  - name: kubectl rollout target
    patterns:
      - '^\s*kubectl\s(?:.*\s)?rollout\s+(?:restart|status|history|undo|pause|resume)\s+(?:\S+\s+)*$'
    sourceCommand: "ns=$(print -r -- $LBUFFER | sed -nE 's/.* (-n|--namespace)[ =]([^ ]+).*/\\2/p'); kubectl get deployments,statefulsets,daemonsets ${ns:+--namespace=$ns} -o name 2>/dev/null | sed -E 's|^deployment\\.apps/|deploy/|; s|^statefulset\\.apps/|sts/|; s|^daemonset\\.apps/|ds/|'"
    options:
      --multi: true
      --prompt: "'Rollout> '"
  # kubectl -n foo get deploy,externalsecret <Tab> → 行内の namespace と種類のリソースを選ぶ
  - name: kubectl resource name
    patterns:
      - '^\s*kubectl\s(?:.*\s)?(?:get|describe|delete|edit)\s+[^-\s]\S*\s+(?:[^-\s]\S*\s+)*$'
    # zeno はクライアントの応答を行単位で読むので、複数行にすると 2 行目以降が fzf のオプション扱いになる。必ず 1 行で書く
    # 種類は引数で渡しているので、-o name の "kind/" を外して名前だけにする (付けたままだと kubectl がエラーにする)
    sourceCommand: "ns=$(print -r -- $LBUFFER | sed -nE 's/.* (-n|--namespace)[ =]([^ ]+).*/\\2/p'); kind=$(print -r -- $LBUFFER | sed -nE 's/.* (get|describe|delete|edit) +([^- ][^ ]*).*/\\2/p'); kubectl get $kind ${ns:+--namespace=$ns} -o name 2>/dev/null | sed 's|^[^/]*/||' | sort -u"
    options:
      --multi: true
      --prompt: "'Resource> '"
  # kubectl -n foo get <Tab> → リソースの種類を複数選んで , でつなぐ (deploy,externalsecret 等)
  # get deploy, <Tab> のように , の後ろでも追加できる
  - name: kubectl resource type
    patterns:
      - '^\s*kubectl\s(?:.*\s)?(?:get|describe|delete|edit|explain)\s+(?:\S+,)?$'
    sourceCommand: "kubectl api-resources --verbs=list --no-headers 2>/dev/null | awk '{print $1}' | sort -u"
    options:
      --multi: true
      --prompt: "'Kind> '"
    callback: "paste -sd, -"
  # 上のどれにも当たらなければ kubectl 組み込みの補完 (kubectl __complete) の候補を fzf で選ぶ (aws cli completer と同じ形)
  # サブコマンド・フラグ・namespace (-n)・出力形式 (-o)・リソース名など kubectl が補完できるものは全部ここで拾える。-n や --context も考慮される
  # ファイルを取るフラグの後ろは kubectl が候補を出さないので、zeno の補完に任せず通常の補完にする
  - name: kubectl completer
    patterns:
      - '^(?!.*\s(?:-f|--filename|-k|--kustomize|--kubeconfig)\s+$)\s*kubectl\s.*$'
    # 補完中の語が空なら "" を足して渡す。出力の最後の :<数字> 行 (シェルへの指示) は除く
    sourceCommand: 'a=(${(z)LBUFFER}); [[ $LBUFFER == *[[:space:]] ]] && a+=(""); kubectl __complete "${(@)a[2,-1]}" 2>/dev/null | grep -v "^:"'
    options:
      --prompt: "'kubectl > '"
      --delimiter: "'\t'"
      --nth: "1"
    # 説明 (タブの後ろ) を落とし、入力途中の語は選んだ候補で置き換える
    callback: 'cut -f1 | { cur=${LBUFFER##*[[:space:]]}; while IFS= read -r c; do print -r -- "$LBUFFER${c#$cur}"; done; }'
