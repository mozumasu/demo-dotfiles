snippets:
  # スペースか Enter で展開される abbrev
  - name: git status
    keyword: gs
    snippet: git status --short --branch
  - name: git diff
    keyword: gd
    snippet: git diff
  - name: git commit
    keyword: gc
    snippet: git commit
  - name: lazygit
    keyword: lg
    snippet: lazygit
  - name: cd project root
    keyword: proot
    snippet: 'cd $(git rev-parse --show-toplevel)'
  - name: claude
    keyword: c
    snippet: claude
  - name: claude personal
    keyword: p
    snippet: claude-p
  - name: claude continue
    keyword: cc
    snippet: claude --continue
  - name: claude resume
    keyword: r
    snippet: --resume
    context:
      lbuffer: '^claude\s+'
  - name: reload shell
    keyword: r
    snippet: exec $SHELL -l
  - name: my ip
    keyword: myip
    snippet: curl ifconfig.me
  # nix-darwin / home-manager の設定を反映する
  - name: darwin-rebuild switch
    keyword: drs
    snippet: sudo darwin-rebuild switch --flake ~/dotfiles/.config/nix#arabica
  # flake.lock の入力を更新する (反映は drs)
  - name: nix flake update
    keyword: nfu
    snippet: nix flake update --flake ~/dotfiles/.config/nix
  # コマンドの後ろで G を打つとパイプで grep につなぐ
  - name: pipe grep
    keyword: G
    snippet: '| grep'
    context:
      lbuffer: '.+\s'   # カーソルより左に、何か + 空白があるときだけ

completions:
  # Tab (zeno-completion) で fzf から選ぶ補完
  # 自分と所属 org のリポジトリ
  - name: gh repo
    patterns:
      - "^gh( .*)? (--repo|-R) $"
    sourceCommand: "{ gh repo list --limit 1000 --json nameWithOwner -q '.[].nameWithOwner'; gh org list | xargs -P4 -I{} gh repo list {} --limit 1000 --json nameWithOwner -q '.[].nameWithOwner'; } 2>/dev/null"
    options:
      --prompt: "'Repo> '"
  # ghq get <Tab> → 自分がアクセスできるリポジトリ (自分・コラボレーター・所属 org) を最近 push された順に選ぶ
  - name: ghq get
    patterns:
      - "^ghq get( .*)? $"
    excludePatterns:
      - " (--branch|-b|--vcs|--partial) $"
    sourceCommand: "gh api '/user/repos?affiliation=owner,collaborator,organization_member&sort=pushed&per_page=100' --paginate -q '.[].full_name' 2>/dev/null"
    options:
      --prompt: "'Repo> '"
  # nix flake init -t github:mozumasu/nix-templates#<Tab> → テンプレート名を説明付きで選ぶ
  - name: nix flake template
    patterns:
      - '^\s*nix flake (?:init|new)\s(?:.*\s)?(?:-t|--template)[ =]github:mozumasu/nix-templates#[^\s#]*$'
    sourceCommand: "nix flake show github:mozumasu/nix-templates --json 2>/dev/null | jq -r '.templates | to_entries[] | \"\\(.key)\\t\\(.value.description // \"\")\"'"
    options:
      --prompt: "'Template> '"
      --delimiter: "'\t'"
      --nth: "1"
    # 説明 (タブの後ろ) を落とし、# の後ろに入力途中の名前があれば選んだ候補で置き換える
    callback: 'cut -f1 | { cur=${LBUFFER##*#}; while IFS= read -r c; do print -r -- "$LBUFFER${c#$cur}"; done; }'
  # 行内の --repo / -R のリポジトリ (なければカレントのリポジトリ) の workflow
  - name: gh workflow
    patterns:
      - "^gh workflow (run|view|enable|disable)( .*)? $"
    excludePatterns:
      - " (--repo|-R|--ref|-r|--field|-f|--raw-field|-F) $"
    sourceCommand: "repo=$(print -r -- $BUFFER | sed -nE 's/.*(--repo|-R)[ =]([^ ]+).*/\\2/p'); gh workflow list ${repo:+--repo=$repo} --json name -q '.[].name' 2>/dev/null"
    options:
      --prompt: "'Workflow> '"
    # 空白を含む workflow 名はクォートする
    callback: "sed -E 's/^(.* .*)$/\"\\1\"/'"
