completions:
  # argocd app diff <Tab> → Application を選ぶ。app 名を取るほかのサブコマンドでも使う
  # argocd にログインしていなければ、今の kube context の Application から選ぶ (kubeswitch の切り替えに追従する)
  - name: argocd app name
    patterns:
      - '^\s*argocd\s+app\s+(?:diff|get|sync|history|manifests|refresh|rollback|wait|resources|logs|delete|set|unset|terminate-op)\s+(?:-\S+\s+)*$'
    sourceCommand: "{ argocd app list -o name 2>/dev/null || kubectl get applications.argoproj.io -A --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null; } | sort -u"
    options:
      --prompt: "'App> '"
